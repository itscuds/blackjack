<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jogo 21</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: "Trebuchet MS", Verdana, sans-serif; background: #1b2a24; }
        #cena { position: fixed; inset: 0; }
        .placa {
            position: fixed; top: 16px; left: 16px; padding: 8px 16px;
            background: #7b1e1e; color: #f6e7c1; border: 3px solid #f6e7c1; border-radius: 6px;
            font-weight: bold; font-size: 26px; letter-spacing: 2px; box-shadow: 0 3px 0 #3d0f0f;
        }
        .painel {
            position: fixed; right: 16px; bottom: 16px; width: 280px; padding: 14px;
            background: #fffdf5; border: 3px solid #222; border-radius: 8px; box-shadow: 4px 4px 0 #111;
        }
        .pontos { display: flex; justify-content: space-between; font-size: 15px; padding: 4px 0; }
        .pontos b { font-size: 20px; }
        .botoes { display: flex; gap: 8px; margin: 12px 0; }
        .botoes button {
            flex: 1; padding: 10px 4px; border: 2px solid #222; border-radius: 6px;
            font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 2px 2px 0 #222;
        }
        .botoes button:active { transform: translate(2px, 2px); box-shadow: none; }
        .botoes button:disabled { opacity: .4; cursor: default; }
        #pedir { background: #66bb6a; }
        #parar { background: #ffb300; }
        #novo { background: #fff; }
        label { display: block; font-size: 13px; }
        select { margin-left: 6px; padding: 3px 6px; border: 2px solid #222; border-radius: 4px; font-weight: bold; }
        .placar { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #bbb; font-size: 13px; color: #444; display: flex; justify-content: space-between; }
        #resultado {
            position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
            padding: 14px 28px; background: #f6e7c1; color: #3d0f0f; border: 4px solid #3d0f0f; border-radius: 10px;
            font-size: 34px; font-weight: bold; box-shadow: 6px 6px 0 #3d0f0f; transition: all .25s; pointer-events: none;
        }
        #resultado.visivel { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .dica { position: fixed; left: 16px; bottom: 16px; color: #d7e4dc; font-size: 13px; background: #00000055; padding: 6px 10px; border-radius: 6px; }
    </style>
</head>

<body>
    <div id="cena"></div>

    <div class="placa">♠ 21 ♥</div>
    <div id="resultado"></div>

    <div class="painel">
        <div class="pontos"><span>Mesa</span><b id="pontosMesa">?</b></div>
        <div class="pontos"><span>Você</span><b id="pontosJogador">0</b></div>
        <div class="botoes">
            <button id="pedir">Pedir carta</button>
            <button id="parar">Parar</button>
        </div>
        <div class="botoes">
            <button id="novo">Novo jogo</button>
        </div>
        <label>Estilo da mesa:
            <select id="estilo"></select>
        </label>
        <div class="placar">
            <span>Vitórias: <b id="vitorias">0</b></span>
            <span>Derrotas: <b id="derrotas">0</b></span>
            <span>Empates: <b id="empates">0</b></span>
        </div>
    </div>

    <div class="dica">Arraste para girar a câmera · role para aproximar</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="/js/vinteum.js"></script>
</body>

</html>
